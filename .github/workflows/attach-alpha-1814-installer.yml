name: Attach verified HGN Alpha 1.8.14 installer

on:
  workflow_dispatch:

concurrency:
  group: hgn-alpha-1814-installer-upload
  cancel-in-progress: false

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Fetch pinned installer chunks
        uses: actions/checkout@v4
        with:
          ref: 17770e5134c8bd9ef1f3880bee8303f4eba35c51
          sparse-checkout: .hgn-release-staging/ALPHA-V1.8.14/chunks
          persist-credentials: false

      - name: Reassemble and verify exact installer
        shell: bash
        run: |
          set -euo pipefail
          parts='.hgn-release-staging/ALPHA-V1.8.14/chunks'
          output="$RUNNER_TEMP/HGN-Launcher-Setup.exe"
          test "$(find "$parts" -maxdepth 1 -type f | wc -l)" -eq 10
          for index in {00..09}; do
            test -f "$parts/part-$index"
          done
          cat "$parts"/part-{00..09} > "$output"
          test "$(stat -c '%s' "$output")" -eq 20867677
          printf '%s  %s\n' '191fd661a00bdc8b3d50a0d1a7dde11962cb75a42962a8835110a06fdc827530' "$output" | sha256sum --check --status
          echo 'Exact tagged installer size and SHA-256 verified.'

      - name: Verify private release draft is unchanged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/402343285")"
          jq -e '
            .id == 402343285 and
            .tag_name == "ALPHA-V1.8.14" and
            .name == "ALPHA-V1.8.14" and
            .draft == true and
            .prerelease == true and
            .target_commitish == "9c0251fccf719c4967d80d0b2620c5e8484b72e1"
          ' <<< "$release" > /dev/null
          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/402343285/assets?per_page=100")"
          jq -e '
            length == 1 and
            .[0].name == "hgn-launcher-update.json" and
            .[0].state == "uploaded" and
            .[0].size == 332 and
            .[0].digest == "sha256:08298cf928a594cfd5f790e3e985a1ba85836892b42a29be9d9085370101e8e6"
          ' <<< "$assets" > /dev/null
          echo 'Exact draft and existing updater asset verified.'

      - name: Attach installer to exact draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --connect-timeout 30 --max-time 600 \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/octet-stream' \
            --data-binary "@$RUNNER_TEMP/HGN-Launcher-Setup.exe" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/402343285/assets?name=HGN-Launcher-Setup.exe")"
          jq -e '
            .name == "HGN-Launcher-Setup.exe" and
            .state == "uploaded" and
            .size == 20867677 and
            .digest == "sha256:191fd661a00bdc8b3d50a0d1a7dde11962cb75a42962a8835110a06fdc827530"
          ' <<< "$response" > /dev/null
          echo 'Verified installer attached to draft.'

      - name: Verify both draft assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/402343285/assets?per_page=100")"
          jq -e '
            length == 2 and
            ([.[] | select(.name == "HGN-Launcher-Setup.exe" and .state == "uploaded" and .size == 20867677 and .digest == "sha256:191fd661a00bdc8b3d50a0d1a7dde11962cb75a42962a8835110a06fdc827530")] | length) == 1 and
            ([.[] | select(.name == "hgn-launcher-update.json" and .state == "uploaded" and .size == 332 and .digest == "sha256:08298cf928a594cfd5f790e3e985a1ba85836892b42a29be9d9085370101e8e6")] | length) == 1
          ' <<< "$assets" > /dev/null
          echo 'Both exact release assets verified; draft remains unpublished.'
