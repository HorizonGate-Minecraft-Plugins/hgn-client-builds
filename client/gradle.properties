# Gradle — deliberately single-threaded so matrix builds do not saturate the machine.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=false
org.gradle.workers.max=1

# Minecraft target. Override per build with -Pmc=<version>; the full supported
# matrix and its per-loader dependency versions live in versions.properties.
default_mc=1.21.4

# Fabric loader is Minecraft-independent, so one version covers the whole matrix.
loader_version=0.19.3

# Validation gate: trusted dev pushes capture the opt-in hotbar in packaged
# 1.21.4/1.21.11 worlds, including vanilla fallback. Rerun the full 35-target
# home-routed client matrix for trusted source changes before any release.

# Mod
mod_version=1.8.21-alpha.1
hgn_release_name=ALPHA-V1.8.21
maven_group=online.horizongate
archives_base_name=hgn-client
