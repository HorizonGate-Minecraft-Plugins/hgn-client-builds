		rootProject.file('common/src/main/java'),
		rootProject.file("common/src/compat/${rootProject.ext.apiGen}/java"),
		rootProject.file("common/src/compat/input/${rootProject.ext.apiGen in ['g1219', 'g12111'] ? 'modern' : 'legacy'}/java"),
		rootProject.file("common/src/compat/worldrow/${rootProject.ext.apiGen in ['g1219', 'g12111'] ? 'modern' : 'legacy'}/java"),
		rootProject.file("common/src/compat/container/${rootProject.ext.apiGen == 'g12111' ? 'modern' : 'legacy'}/java"),
	]
	if (rootProject.ext.apiGen == 'g1212') {
		def scrollGen = rootProject.ext.mcVersion in ['1.21.2', '1.21.3'] ? 'legacy' : 'modern'
		sourceSets.main.java.srcDirs += rootProject.file("common/src/compat/scroll/${scrollGen}/java")
	}
	def equipmentGen = matrix.getProperty("${rootProject.ext.mcVersion}.equipment_gen")?.trim()
	if (equipmentGen) {
		sourceSets.main.java.srcDirs +=
			rootProject.file("common/src/compat/equipment/${equipmentGen}/java")
	}
	def itemRenderGen = matrix.getProperty("${rootProject.ext.mcVersion}.item_render_gen")?.trim()
	if (itemRenderGen) {
		sourceSets.main.java.srcDirs +=
			rootProject.file("common/src/compat/item_render/${itemRenderGen}/java")
	}
	sourceSets.main.resources.srcDirs += rootProject.file('common/src/main/resources')
	def inventoryGen = rootProject.ext.mcVersion in ['1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4'] ? 'legacy' : 'equipment'
	sourceSets.main.java.srcDirs += rootProject.file("common/src/compat/inventory/${inventoryGen}/java")
	tasks.named('check') { dependsOn rootProject.tasks.named('verifyVanillaInventoryContract') }

