plugins {
	id 'dev.architectury.loom' version '1.17.491' apply false
}

def matrix = new Properties()
file('versions.properties').withInputStream { matrix.load(it) }

def supported = matrix.getProperty('mc.list').split(',').collect { it.trim() }
def selected = (project.findProperty('mc') ?: project.default_mc).toString()

if (!supported.contains(selected)) {
	throw new GradleException("Unsupported Minecraft version '${selected}'. Supported: ${supported.join(', ')}")
}

// The client is shipped with the launcher and reports its version in-game, so
// it takes the launcher's rather than carrying one of its own that drifts.
def launcherPackage = file('../apps/app-frontend/package.json')
def launcherMetadata = launcherPackage.exists()
	? new groovy.json.JsonSlurper().parse(launcherPackage)
	: null
def clientVersion = (launcherMetadata?.version ?: project.mod_version).toString()
def releaseName = (launcherMetadata?.hgnReleaseName ?: project.hgn_release_name)?.toString()?.trim()
if (!releaseName) {
	throw new GradleException('apps/app-frontend/package.json must define hgnReleaseName')
}
def alphaVersion = clientVersion =~ /^(\d+\.\d+\.\d+)-alpha\.1$/
def alphaBuild = alphaVersion.matches()
def betaVersion = clientVersion =~ /^(\d+\.\d+\.\d+)-beta\.(0|[1-9]\d*)$/
def betaBuild = betaVersion.matches()
if (clientVersion.contains('-alpha') && !alphaBuild) {
	throw new GradleException("HGN Alpha machine version '${clientVersion}' must use X.Y.Z-alpha.1")
}
if (clientVersion.contains('-beta') && !betaBuild) {
	throw new GradleException("HGN Beta machine version '${clientVersion}' must use X.Y.Z-beta.N")
}
if (alphaBuild) {
	def expectedReleaseName = "ALPHA-V${alphaVersion.group(1)}"
	if (releaseName != expectedReleaseName) {
		throw new GradleException("HGN release name '${releaseName}' does not match '${clientVersion}'; expected '${expectedReleaseName}'")
	}
}
if (betaBuild) {
	def expectedReleaseName = "v${clientVersion}"
	if (releaseName != expectedReleaseName) {
		throw new GradleException("HGN release name '${releaseName}' does not match '${clientVersion}'; expected '${expectedReleaseName}'")
	}
}

ext {
	mcVersion = selected
	hgnVersion = clientVersion
	hgnReleaseName = releaseName
	apiGen = matrix.getProperty("${selected}.gen")
	javaVersion = (matrix.getProperty("${selected}.java") ?: '21') as int
	fabricApiVersion = matrix.getProperty("${selected}.fabric_api")?.trim()
	forgeVersion = matrix.getProperty("${selected}.forge")?.trim()
	neoforgeVersion = matrix.getProperty("${selected}.neoforge")?.trim()
}

tasks.register('verifyVanillaInventoryContract') {
	group = 'verification'
	description = 'Keep native inventory controls and container layouts unchanged.'
	doLast {
		def injection = file('common/src/main/java/online/horizongate/hgn/mixin/HgnInventoryCosmeticsMixin.java')
		if (injection.exists()) {
			throw new GradleException('The vanilla inventory must not gain a Cosmetics control injection')
		}
		def mixins = new groovy.json.JsonSlurper().parse(file('common/src/main/resources/hgn-client.mixins.json'))
		if (mixins.client.any { it in ['HgnInventoryCosmeticsMixin', 'HgnContainerScreenMixin'] }) {
			throw new GradleException('The vanilla inventory or container replacement mixin is registered')
		}
		def config = file('common/src/main/java/online/horizongate/hgn/HgnConfig.java').text
		def inactiveLayout = config =~ /public boolean containerLayoutsEnabled\(\)\s*\{\s*return false;\s*\}/
		if (!inactiveLayout.find()) {
			throw new GradleException('Vanilla container layout replacement is no longer disabled')
		}
		['HgnDashboardScreen.java', 'HgnPauseScreen.java'].each { menu ->
			def source = file("common/src/main/java/online/horizongate/hgn/screen/${menu}").text
			if (!source.contains('new HgnCosmeticsScreen(this)')) {
				throw new GradleException("Cosmetics is no longer reachable from ${menu}")
			}
		}
	}
}

