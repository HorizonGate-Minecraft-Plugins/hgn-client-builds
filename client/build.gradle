	// A loader's own API can also move between Minecraft versions (NeoForge
	// relocated its client-side packet sender in 21.7), so each loader may carry
	// its own generation directory too.
	def loaderGen = matrix.getProperty("${rootProject.ext.mcVersion}.${project.name}_gen")?.trim()
	if (loaderGen) {
		sourceSets.main.java.srcDirs += file("src/compat/${loaderGen}/java")
	}

	tasks.register('verifyUpdateDestinationReports', JavaExec) {
		group = 'verification'
		dependsOn tasks.named('layoutTestClasses')
		classpath = sourceSets.layoutTest.runtimeClasspath
		mainClass = 'HgnUpdateDestinationTest'
	}
	tasks.named('check') { dependsOn tasks.named('verifyUpdateDestinationReports') }
	tasks.register('verifyUpdateOffers', JavaExec) {
		group = 'verification'
		dependsOn tasks.named('layoutTestClasses')
		classpath = sourceSets.layoutTest.runtimeClasspath
		mainClass = 'HgnUpdateOfferTest'
	}
	tasks.named('check') { dependsOn tasks.named('verifyUpdateOffers') }
	tasks.register('verifyUpdateTransactions', JavaExec) {
		group = 'verification'
		dependsOn tasks.named('layoutTestClasses')
		classpath = sourceSets.layoutTest.runtimeClasspath
		mainClass = 'HgnUpdateTransactionTest'
	}
	tasks.named('check') { dependsOn tasks.named('verifyUpdateTransactions') }
	tasks.register('verifyPackSelectionLayouts', JavaExec) {
		group = 'verification'
		dependsOn tasks.named('layoutTestClasses')
		classpath = sourceSets.layoutTest.runtimeClasspath
		mainClass = 'HgnPackSelectionLayoutTest'
	}
	tasks.named('check') { dependsOn tasks.named('verifyPackSelectionLayouts') }
	tasks.register('verifyDisconnectedLayouts', JavaExec) {
		group = 'verification'
		dependsOn tasks.named('layoutTestClasses')
		classpath = sourceSets.layoutTest.runtimeClasspath
		mainClass = 'HgnDisconnectedLayoutTest'
	}
	tasks.named('check') { dependsOn tasks.named('verifyDisconnectedLayouts') }
	tasks.register('verifyConnectionLayouts', JavaExec) {
		group = 'verification'
		dependsOn tasks.named('layoutTestClasses')
		classpath = sourceSets.layoutTest.runtimeClasspath
		mainClass = 'HgnConnectionLayoutTest'
	}
	tasks.named('check') { dependsOn tasks.named('verifyConnectionLayouts') }

	def buildInfoDir = layout.buildDirectory.dir('generated/hgn')
	def generateBuildInfo = tasks.register('generateHgnBuildInfo') {
		def target = buildInfoDir
		def mc = rootProject.ext.mcVersion
		def loaderName = project.name
		def clientVer = rootProject.ext.hgnVersion
		def release = rootProject.ext.hgnReleaseName
		inputs.property 'mcVersion', mc
		inputs.property 'loader', loaderName
		inputs.property 'clientVersion', clientVer
		inputs.property 'releaseName', release
		outputs.dir target
		doLast {
			def pkg = target.get().dir('online/horizongate/hgn').asFile
			pkg.mkdirs()
			new File(pkg, 'HgnBuild.java').text = """package online.horizongate.hgn;

/** Generated at build time — do not edit. */
public final class HgnBuild {
	public static final String CLIENT_VERSION = "${clientVer}";
	public static final String RELEASE_NAME = "${release}";
	public static final String MINECRAFT_VERSION = "${mc}";
	public static final String LOADER = "${loaderName}";

	private HgnBuild() {
	}
}
"""
		}
	}
	sourceSets.main.java.srcDir generateBuildInfo

	processResources {
		// Entitlement-only model and texture assets belong in the private member
		// pack, never in a publicly downloadable client jar.
		exclude { details ->
			details.path.startsWith('assets/hgn_cosmetics/models/') ||
				details.path.startsWith('assets/hgn_cosmetics/textures/')
		}
		inputs.property 'version', project.version
		inputs.property 'mcVersion', rootProject.ext.mcVersion
		filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
			expand 'version': project.version, 'mcVersion': rootProject.ext.mcVersion
		}
	}

	tasks.register('verifyBundledResources') {
		group = 'verification'
		dependsOn tasks.named('remapJar')
		doLast {
			def assetRoot = rootProject.file('common/src/main/resources/assets/hgn-client')
			def assets = rootProject.fileTree(assetRoot).files
			if (assets.isEmpty()) throw new GradleException('No HGN client assets found')
			def artifact = tasks.named('remapJar').get().archiveFile.get().asFile
			new java.util.zip.ZipFile(artifact).withCloseable { jar ->
				def privateAssets = jar.entries().findAll { entry ->
					entry.name.startsWith('assets/hgn_cosmetics/models/') ||
						entry.name.startsWith('assets/hgn_cosmetics/textures/')
				}
				if (!privateAssets.isEmpty()) {
					throw new GradleException("${artifact.name} contains private Cosmetics assets")
				}
				assets.each { source ->
					def relative = assetRoot.toPath().relativize(source.toPath()).toString().replace('\\', '/')
					def path = "assets/hgn-client/${relative}"
					def entry = jar.getEntry(path)
					if (entry == null || entry.size <= 0) {
						throw new GradleException("${artifact.name} is missing HGN asset ${path}")
					}
					if (relative.endsWith('.png')) {
						jar.getInputStream(entry).withCloseable { input ->
							def image = javax.imageio.ImageIO.read(input)
							if (image == null || image.width <= 0 || image.height <= 0) {
								throw new GradleException("${artifact.name} has an invalid HGN PNG ${path}")
							}
						}
					} else if (relative.endsWith('.ttf')) {
						jar.getInputStream(entry).withCloseable { input ->
							if (new java.io.DataInputStream(input).readInt() != 0x00010000) {
								throw new GradleException("${artifact.name} has an invalid HGN font ${path}")
							}
						}
					}
				}
				def fontEntry = jar.getEntry('assets/hgn-client/font/ui.json')
				if (fontEntry == null) throw new GradleException("${artifact.name} is missing the HGN UI font definition")
				def fontDefinition = jar.getInputStream(fontEntry).withCloseable { input ->
					new groovy.json.JsonSlurper().parse(input)
				}
				if (!fontDefinition.providers.any {
					it.type == 'ttf' && it.file == 'hgn-client:inter_regular.ttf'
				}) {
					throw new GradleException("${artifact.name} does not select the bundled HGN UI font")
				}
				def headingEntry = jar.getEntry('assets/hgn-client/font/heading.json')
				if (headingEntry == null) throw new GradleException("${artifact.name} is missing the HGN heading font definition")
				def headingDefinition = jar.getInputStream(headingEntry).withCloseable { input ->
					new groovy.json.JsonSlurper().parse(input)
				}
				if (!headingDefinition.providers.any {
					it.type == 'ttf' && it.file == 'hgn-client:rajdhani_semibold.ttf'
				}) {
					throw new GradleException("${artifact.name} does not select the bundled HGN heading font")
				}
				if (project.name == 'fabric' && rootProject.ext.apiGen in ['g1219', 'g12111', 'g2601']) {
					def loaderPresent = jar.entries().any {
						it.name.startsWith('META-INF/jars/fabric-resource-loader-v1-') && it.name.endsWith('.jar')
					}
					if (!loaderPresent) {
						throw new GradleException("${artifact.name} cannot load bundled assets without Fabric Resource Loader v1")
					}
				}
			}
		}
	}
	tasks.named('build') { dependsOn tasks.named('verifyBundledResources') }

	// Minecraft 1.21.x runs on Java 21; the 26.x line requires Java 25.
	tasks.withType(JavaCompile).configureEach {
		it.options.encoding = 'UTF-8'
		it.options.release = rootProject.ext.javaVersion
	}

	java {
		toolchain.languageVersion = JavaLanguageVersion.of(rootProject.ext.javaVersion)
	}

	// Lets a visual check jump straight to one screen: -Pdevscreen=multiplayer
	// (also join_hub / join_vinksmp). Loom's run tasks are plain JavaExec.
	if (project.hasProperty('devscreen')) {
		tasks.withType(JavaExec).configureEach {
			systemProperty 'hgn.devscreen', project.property('devscreen')
			if (project.property('devscreen') == 'container-smoke') {
				systemProperty 'fabric.noGui', 'true'
			}
		}
	}
}
